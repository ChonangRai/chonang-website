{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal site about computing, research, writing, and cinema.">
    <title>{% block title %}Your Name — Personal Site{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell" id="top">
      <header class="site-header">
        <a class="wordmark" href="{% url 'core:home' %}" aria-label="Your Name, home">
          <span class="wordmark-name">Your Name</span>
          <span class="wordmark-note">Personal index</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#top">Home</a>
          <a href="#about">About</a>
        </nav>
      </header>

      <main id="main">
        {% block content %}{% endblock %}
      </main>

      <footer class="site-footer">
        <p>Made with curiosity and care.</p>
        <a href="#top">Back to the beginning <span aria-hidden="true">↑</span></a>
      </footer>
    </div>
  </body>
</html>
